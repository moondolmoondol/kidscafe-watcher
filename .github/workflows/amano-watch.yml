name: 아마노 주차대행 예약 감시

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: amano-valet-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amano-valet
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 감시 스크립트 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATES: "2026-09-26"
        run: python monitor.py

      - name: 상태 파일 커밋
        run: |
          git config user.name "amano-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "state update" || echo "변경 없음"
          git push
