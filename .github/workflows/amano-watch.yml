name: 아마노 주차대행 예약 감시

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: amano-valet-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: amano-valet
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 감시 스크립트 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATES: "2026-09-26"
        run: python monitor.py

      - name: 상태 파일 커밋
        run: |
          git config user.name "amano-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "state update" || echo "변경 없음"
          # 다른 워크플로(키즈카페 등)가 같은 저장소에 동시에 push할 수 있으므로,
          # 실패 시 최신 내용을 받아 rebase 후 재시도합니다.
          for i in 1 2 3 4 5; do
            git push && break
            echo "push 실패, 재시도 $i/5..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 5 + 1))
          done
