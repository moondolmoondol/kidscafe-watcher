name: 키즈카페 예약 감시

on:
  schedule:
    # 5분마다 실행 (GitHub 사양상 실제로는 조금 더 늦게(보통 5~15분) 실행될 수 있습니다)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # 저장소의 Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write   # state.json 을 다시 커밋하기 위해 필요

concurrency:
  group: kidscafe-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존 패키지 설치
        run: pip install -r requirements.txt

      - name: 감시 스크립트 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: 상태 파일 커밋
        run: |
          git config user.name "kidscafe-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "state update" || echo "변경 없음"
          # 다른 워크플로(아마노 등)가 같은 저장소에 동시에 push할 수 있으므로,
          # 실패 시 최신 내용을 받아 rebase 후 재시도합니다.
          for i in 1 2 3 4 5; do
            git push && break
            echo "push 실패, 재시도 $i/5..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 5 + 1))
          done
